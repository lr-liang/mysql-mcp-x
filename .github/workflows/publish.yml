name: Publish to NPM

on:
  # 方式1：通过 GitHub Release 发布时触发
  release:
    types: [published]

  # 方式2：推送以 v 开头的 tag 时触发（最常用）
  push:
    tags:
      - 'v*'

  # 方式3：手动在 GitHub Actions 页面触发
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # 防止同一个版本重复发布
    permissions:
      contents: read
      id-token: write   # 如果以后要用 npm provenance 可开启

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 重要！必须获取完整历史和 tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public   # 如果是公开包，加上 --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}